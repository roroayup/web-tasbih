<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#020c06">
<meta name="description" content="Penghitung tasbih digital dengan bacaan dzikir yang bisa Anda tulis sendiri.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tasbih</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020c06; --fg:#ffffff; --accent:#0af58f; --accent-dim:rgba(10,245,143,.18);
    --muted:rgba(10,245,143,.55); --panel:#06180e; --line:rgba(10,245,143,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  svg{display:block}
  .app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0;color:var(--accent)}
  .chip{display:flex;align-items:center;gap:8px;font-size:clamp(26px,7vw,40px);font-weight:300;line-height:1;padding:8px 6px;border-radius:12px}
  .chip:active{background:var(--accent-dim)}
  .chip svg{width:.75em;height:.75em}
  .chip .caret{width:.55em;height:.55em;opacity:.9}

  /* reading */
  .reading{text-align:center;padding:18px 24px 0;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .reading .ar{font-family:Amiri,serif;font-size:clamp(24px,6.5vw,34px);direction:rtl;line-height:1.6;color:var(--fg)}
  .reading .lat{font-size:15px;color:var(--accent);font-weight:400}
  .reading .tr{font-size:13px;color:rgba(255,255,255,.5);font-weight:300}

  /* count */
  .count{text-align:center;font-weight:200;font-size:clamp(110px,32vw,190px);line-height:1;letter-spacing:-.02em;margin-top:4px;transition:opacity .2s, transform .08s}
  .count.bump{transform:scale(1.04)}
  .hidden-count .count{opacity:0}

  /* ring */
  .app{touch-action:manipulation;cursor:pointer}
  .ring-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0}
  .ring{position:relative;height:min(100%,94vw,520px);aspect-ratio:1;min-height:200px;border-radius:50%}
  .ring svg{width:100%;height:100%;overflow:visible}
  .ring .plus{position:absolute;inset:0;margin:auto;width:48%;height:48%;color:var(--accent);pointer-events:none;transition:transform .1s}
  .ring.press .plus{transform:scale(.9)}

  /* bottom */
  .bottom{display:flex;justify-content:space-between;align-items:center;padding:0 24px 22px}
  .round-btn{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent)}
  .round-btn:active{background:var(--accent-dim)}
  .eye{width:64px;height:64px;display:grid;place-items:center;color:var(--line)}
  .hidden-count .eye{color:var(--accent)}

  /* sheets */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:85dvh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:11;user-select:text;-webkit-user-select:text}
  .sheet.on{transform:none}
  .sheet h2{margin:2px 4px 14px;font-weight:400;font-size:20px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
  .sheet h2 button{font-size:15px;color:var(--muted)}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opt{border:1px solid var(--line);border-radius:14px;padding:14px 0;text-align:center;font-size:20px;color:var(--accent)}
  .opt.sel{background:var(--accent);color:var(--bg)}
  .row{display:flex;gap:10px;margin-top:12px}
  input,textarea{width:100%;background:#020c06;border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px 14px;font:inherit;font-size:16px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  textarea.ar-in{font-family:Amiri,serif;font-size:22px;direction:rtl}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 4px 6px}
  .btn{background:var(--accent);color:var(--bg);border-radius:12px;padding:12px 18px;font-weight:500;white-space:nowrap}
  .btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
  .btn.danger{background:none;color:#ff6b7a;border:1px solid rgba(255,107,122,.35)}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
  .item.sel{border-color:var(--accent);background:var(--accent-dim)}
  .item .body{flex:1;min-width:0;text-align:left}
  .item .a{font-family:Amiri,serif;font-size:20px;direction:rtl;text-align:right;color:#fff;line-height:1.5}
  .item .l{font-size:14px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:12px;color:rgba(255,255,255,.45)}
  .item .edit{color:var(--muted);padding:6px}
  .empty-note{color:rgba(255,255,255,.5);font-size:14px;text-align:center;padding:8px}
  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,200px);background:var(--accent);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:500;transition:transform .25s;z-index:20;white-space:nowrap}
  .toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="chip" id="targetBtn" aria-label="Target hitungan">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="2.5" r="1.8"/><circle cx="18.7" cy="5.3" r="1.8"/><circle cx="21.5" cy="12" r="1.8"/><circle cx="18.7" cy="18.7" r="1.8"/><circle cx="12" cy="21.5" r="1.8"/><circle cx="5.3" cy="18.7" r="1.8"/><circle cx="2.5" cy="12" r="1.8"/><circle cx="5.3" cy="5.3" r="1.8"/></svg>
      <span id="targetTxt">100</span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <button class="chip" id="stepBtn" aria-label="Langkah tambah">
      <span id="stepTxt">+1</span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <button class="chip" id="editBtn" aria-label="Pilih atau tulis bacaan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em"><path d="M16.5 3.5a2.1 2.1 0 013 3L8 18l-4 1 1-4 11.5-11.5z"/></svg>
    </button>
    <button class="chip" id="roundBtn" aria-label="Putaran selesai, ketuk untuk reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
      <span id="roundTxt">0</span>
    </button>
  </div>

  <div class="reading" id="reading">
    <div class="ar" id="rAr"></div>
    <div class="lat" id="rLat"></div>
    <div class="tr" id="rTr"></div>
  </div>

  <div class="count" id="count">0</div>

  <div class="ring-wrap">
    <div class="ring" id="ring" role="button" aria-label="Tambah hitungan" tabindex="0">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="100" y1="5" x2="130" y2="10">
            <stop offset="0" stop-color="#0af58f" stop-opacity="0"/><stop offset="1" stop-color="#0af58f" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(10,245,143,.22)" stroke-width="2"/>
        <circle id="arc" cx="100" cy="100" r="95" fill="none" stroke="#0af58f" stroke-width="2.4" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="0 1000"/>
        <g id="handle"><rect x="95.5" y="-2" width="9" height="15" rx="4.5" fill="#0af58f"/></g>
      </svg>
      <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg>
    </div>
  </div>

  <div class="bottom">
    <button class="round-btn" id="minusBtn" aria-label="Kurangi">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16"/></svg>
    </button>
    <button class="eye" id="eyeBtn" aria-label="Sembunyikan angka">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<!-- target sheet -->
<div class="sheet" id="targetSheet">
  <h2>Target hitungan <button data-close>Tutup</button></h2>
  <div class="opts" id="targetOpts"></div>
  <div class="row"><input id="targetCustom" type="number" inputmode="numeric" min="1" placeholder="Angka lain, mis. 1000"><button class="btn" id="targetSet">Pakai</button></div>
</div>

<!-- step sheet -->
<div class="sheet" id="stepSheet">
  <h2>Tambah per ketukan <button data-close>Tutup</button></h2>
  <div class="opts" id="stepOpts"></div>
</div>

<!-- reading list sheet -->
<div class="sheet" id="listSheet">
  <h2>Bacaan <button data-close>Tutup</button></h2>
  <div class="list" id="list"></div>
  <div class="row"><button class="btn" id="addBtn" style="flex:1">+ Tulis bacaan sendiri</button></div>
</div>

<!-- edit sheet -->
<div class="sheet" id="formSheet">
  <h2><span id="formTitle">Bacaan baru</span> <button data-close>Batal</button></h2>
  <label for="fAr">Teks Arab (opsional)</label>
  <textarea id="fAr" class="ar-in" rows="2" placeholder="سُبْحَانَ اللّٰهِ"></textarea>
  <label for="fLat">Nama / bacaan latin</label>
  <input id="fLat" placeholder="Subhanallah">
  <label for="fTr">Arti (opsional)</label>
  <input id="fTr" placeholder="Maha Suci Allah">
  <label for="fTarget">Target bawaan</label>
  <input id="fTarget" type="number" inputmode="numeric" min="1" placeholder="33">
  <div class="row">
    <button class="btn danger" id="fDel">Hapus</button>
    <button class="btn" id="fSave" style="flex:1">Simpan</button>
  </div>
</div>

<!-- confirm sheet -->
<div class="sheet" id="confirmSheet">
  <h2>Mulai ulang?</h2>
  <p style="margin:0 4px 6px;color:rgba(255,255,255,.7)">Hitungan dan jumlah putaran untuk bacaan ini akan kembali ke 0.</p>
  <div class="row"><button class="btn ghost" data-close style="flex:1">Batal</button><button class="btn" id="confirmYes" style="flex:1">Reset</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'tasbih.v1';
  const DEFAULTS = [
    {id:'subhanallah', ar:'سُبْحَانَ اللّٰهِ', lat:'Subhanallah', tr:'Maha Suci Allah', target:33},
    {id:'alhamdulillah', ar:'اَلْحَمْدُ لِلّٰهِ', lat:'Alhamdulillah', tr:'Segala puji bagi Allah', target:33},
    {id:'allahuakbar', ar:'اَللّٰهُ أَكْبَرُ', lat:'Allahu Akbar', tr:'Allah Maha Besar', target:33},
    {id:'tahlil', ar:'لَا إِلٰهَ إِلَّا اللّٰهُ', lat:'Laa ilaaha illallah', tr:'Tiada Tuhan selain Allah', target:100},
    {id:'istighfar', ar:'أَسْتَغْفِرُ اللّٰهَ', lat:'Astaghfirullah', tr:'Aku memohon ampun kepada Allah', target:100},
    {id:'shalawat', ar:'اَللّٰهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ', lat:'Allahumma shalli ‘ala sayyidina Muhammad', tr:'Ya Allah, limpahkan rahmat kepada junjungan kami Nabi Muhammad', target:100},
  ];
  const TARGETS = [33, 99, 100, 1000];
  const STEPS = [1, 3, 5, 10];

  // ---------- state ----------
  let S;
  function load(){
    try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
    if (!S || !Array.isArray(S.items)) {
      S = { items: DEFAULTS.map(d => ({...d})), current: DEFAULTS[0].id, step: 1, hidden: false, progress: {} };
    }
    if (!S.items.length) S.items = DEFAULTS.map(d => ({...d}));
    if (!S.items.find(i => i.id === S.current)) S.current = S.items[0].id;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
  const cur = () => S.items.find(i => i.id === S.current);
  const prog = () => (S.progress[S.current] ||= { count: 0, rounds: 0, target: cur().target || 33, history: [] });

  // ---------- dom ----------
  const $ = id => document.getElementById(id);
  const app = $('app'), ring = $('ring'), arc = $('arc'), handle = $('handle');
  const CIRC = 2 * Math.PI * 95;

  function render(){
    const it = cur(), p = prog();
    $('rAr').textContent = it.ar || '';
    $('rAr').style.display = it.ar ? '' : 'none';
    $('rLat').textContent = it.lat || '';
    $('rTr').textContent = it.tr || '';
    $('rTr').style.display = it.tr ? '' : 'none';
    $('count').textContent = p.count;
    $('targetTxt').textContent = p.target;
    $('stepTxt').textContent = '+' + S.step;
    $('roundTxt').textContent = p.rounds;
    const frac = Math.min(p.count / p.target, 1);
    arc.setAttribute('stroke-dasharray', `${frac * CIRC} ${CIRC}`);
    handle.setAttribute('transform', `rotate(${frac * 360} 100 100)`);
    app.classList.toggle('hidden-count', !!S.hidden);
  }

  // ---------- haptics ----------
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e) {} };

  // ---------- actions ----------
  function add(){
    const p = prog();
    if (p.count >= p.target) { // start new round
      p.count = 0;
    }
    p.history.push(p.count);
    if (p.history.length > 200) p.history.shift();
    p.count = Math.min(p.count + S.step, p.target);
    if (p.count >= p.target) {
      p.rounds++;
      buzz([80, 60, 80, 60, 200]);
      toast(`${cur().lat || 'Bacaan'} — ${p.target}× selesai`);
    } else {
      buzz(18);
    }
    const c = $('count'); c.classList.add('bump'); ring.classList.add('press');
    setTimeout(() => { c.classList.remove('bump'); ring.classList.remove('press'); }, 100);
    save(); render();
  }
  function minus(){
    const p = prog();
    if (p.count === 0) return;
    if (p.count >= p.target && p.rounds > 0) p.rounds--;
    p.count = Math.max(0, p.count - S.step);
    buzz(10); save(); render();
  }

  // tap anywhere on the screen (except buttons) adds; one pointer at a time
  app.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button > 0 || e.target.closest('button')) return;
    e.preventDefault(); add();
  });
  ring.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); add(); } });
  document.addEventListener('keydown', e => {
    if (document.querySelector('.sheet.on')) return;
    if (e.target === ring) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === '+') { e.preventDefault(); add(); }
    if (e.key === 'Backspace' || e.key === 'ArrowDown' || e.key === '-') { e.preventDefault(); minus(); }
  });
  $('minusBtn').onclick = minus;
  $('eyeBtn').onclick = () => { S.hidden = !S.hidden; save(); render(); };

  // ---------- sheets ----------
  const scrim = $('scrim');
  let openSheet = null;
  function open(id){ close(); openSheet = $(id); openSheet.classList.add('on'); scrim.classList.add('on'); }
  function close(){ if (openSheet) openSheet.classList.remove('on'); openSheet = null; scrim.classList.remove('on'); }
  scrim.onclick = close;
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = close);

  function opts(el, values, selected, fmt, onPick){
    el.innerHTML = '';
    values.forEach(v => {
      const b = document.createElement('button');
      b.className = 'opt' + (v === selected ? ' sel' : '');
      b.textContent = fmt(v);
      b.onclick = () => { onPick(v); close(); };
      el.appendChild(b);
    });
  }
  function setTarget(v){
    const p = prog(); p.target = v;
    if (p.count > v) p.count = v;
    save(); render();
  }
  $('targetBtn').onclick = () => {
    opts($('targetOpts'), TARGETS, prog().target, v => v, setTarget);
    $('targetCustom').value = '';
    open('targetSheet');
  };
  $('targetSet').onclick = () => {
    const v = parseInt($('targetCustom').value, 10);
    if (v > 0 && v <= 1000000) { setTarget(v); close(); }
  };
  $('stepBtn').onclick = () => {
    opts($('stepOpts'), STEPS, S.step, v => '+' + v, v => { S.step = v; save(); render(); });
    open('stepSheet');
  };

  // reset
  $('roundBtn').onclick = () => open('confirmSheet');
  $('confirmYes').onclick = () => {
    const p = prog(); p.count = 0; p.rounds = 0; p.history = [];
    save(); render(); close();
  };

  // reading list
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderList(){
    const L = $('list'); L.innerHTML = '';
    S.items.forEach(it => {
      const p = S.progress[it.id];
      const row = document.createElement('div');
      row.className = 'item' + (it.id === S.current ? ' sel' : '');
      row.innerHTML = `<button class="body">
          ${it.ar ? `<div class="a">${esc(it.ar)}</div>` : ''}
          <div class="l">${esc(it.lat || '(tanpa nama)')}</div>
          <div class="m">${p ? `${p.count}/${p.target} · ${p.rounds} putaran` : `Target ${it.target || 33}`}</div>
        </button>
        <button class="edit" aria-label="Ubah"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 013 3L8 18l-4 1 1-4 11.5-11.5z"/></svg></button>`;
      row.querySelector('.body').onclick = () => { S.current = it.id; save(); render(); close(); };
      row.querySelector('.edit').onclick = () => openForm(it.id);
      L.appendChild(row);
    });
  }
  $('editBtn').onclick = () => { renderList(); open('listSheet'); };

  // form
  let editingId = null;
  function openForm(id){
    editingId = id || null;
    const it = id ? S.items.find(i => i.id === id) : {ar:'', lat:'', tr:'', target:33};
    $('formTitle').textContent = id ? 'Ubah bacaan' : 'Bacaan baru';
    $('fAr').value = it.ar || ''; $('fLat').value = it.lat || ''; $('fTr').value = it.tr || '';
    $('fTarget').value = it.target || 33;
    $('fDel').style.display = id && S.items.length > 1 ? '' : 'none';
    open('formSheet');
    setTimeout(() => (id ? null : $('fLat').focus()), 260);
  }
  $('addBtn').onclick = () => openForm(null);
  $('fSave').onclick = () => {
    const ar = $('fAr').value.trim(), lat = $('fLat').value.trim(), tr = $('fTr').value.trim();
    let target = parseInt($('fTarget').value, 10); if (!(target > 0)) target = 33;
    if (!ar && !lat) { $('fLat').focus(); toast('Isi teks Arab atau latin dulu'); return; }
    if (editingId) {
      Object.assign(S.items.find(i => i.id === editingId), {ar, lat, tr, target});
      if (S.progress[editingId] && S.progress[editingId].count === 0) S.progress[editingId].target = target;
    } else {
      const id = 'c' + Date.now().toString(36);
      S.items.push({id, ar, lat, tr, target});
      S.current = id;
    }
    save(); render(); close();
    toast('Bacaan disimpan');
  };
  $('fDel').onclick = () => {
    if (!editingId) return;
    S.items = S.items.filter(i => i.id !== editingId);
    delete S.progress[editingId];
    if (S.current === editingId) S.current = S.items[0].id;
    save(); render(); close();
    toast('Bacaan dihapus');
  };

  // toast
  let tt;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800);
  }

  // keep screen awake while counting (where supported)
  let lock;
  async function wake(){ try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch(e) {} }
  document.addEventListener('visibilitychange', wake);
  app.addEventListener('pointerdown', () => { if (!lock) wake(); }, {once:true});

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  load(); render();
})();
</script>
